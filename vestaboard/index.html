
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vestaboard Control</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101114;color:#f5f5f5;
 font-family:Arial,Helvetica,sans-serif;
}
main{max-width:520px;margin:auto;padding:24px 18px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:10px 0}
.subtitle{color:#9297a3;font-size:13px}
.panel{
 background:#1b1d22;border:1px solid #32353d;
 border-radius:18px;padding:18px;margin-top:22px;
}
.heading{font-size:13px;color:#a4a9b4;margin-bottom:16px}
.board{background:#080808;padding:12px 6px;border-radius:10px}
.board-row{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:4px 0}
.tile{
 aspect-ratio:0.82;background:#292929;
 border-radius:2px;display:flex;align-items:center;
 justify-content:center;font-size:clamp(7px,1.7vw,12px);
 font-weight:700;color:#111;
}
.tile.filled{background:#e3e1db}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
 background:#2b2e36;color:white;border:1px solid #454952;
 border-radius:14px;padding:22px 10px;font-size:17px;font-weight:bold;
}
button:disabled{opacity:.55;cursor:not-allowed}
button small{display:block;font-size:12px;font-weight:normal;color:#a4a9b4;margin-top:7px}
.statrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #33363d}
.statrow:last-child{border:0}
.muted{color:#a4a9b4}
.notice{margin-top:15px;color:#a4a9b4;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>Vestaboard</h1>
<div class="subtitle">Mobile Control Centre</div>
</div>
<div style="font-size:28px">▦</div>
</header>

<section class="panel">
<div class="heading">BOARD PREVIEW · DEMONSTRATION</div>
<div class="board" id="board"></div>
<div class="notice">Live board connection pending</div>
</section>

<section class="panel">
<div class="heading">CONTROLS</div>
<div class="controls">
<button disabled>⏭ Next<small>Change quote</small></button>
<button disabled>✕ Remove<small>Exclude quote</small></button>
<button disabled>▤ Status<small>Quote statistics</small></button>
<button disabled>↻ Reset<small>Restart cycle</small></button>
</div>
<div class="notice">Controls will activate after secure connection.</div>
</section>

<section class="panel">
<div class="heading">QUOTE LIBRARY · LAST VERIFIED</div>
<div class="statrow"><span class="muted">Active quotes</span><strong>291</strong></div>
<div class="statrow"><span class="muted">Permanently removed</span><strong>1</strong></div>
<div class="notice">These figures are not live. Status will refresh them once connected.</div>
</section>
</main>


<script>
const board = document.getElementById("board");
const heading = document.querySelector(".heading");
const notice = board.nextElementSibling;

const source =
  "https://raw.githubusercontent.com/AJHazell64/Vestaboard/main/data/current-board.json";

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const numbers = "1234567890";

const symbols = {
  37:"!",38:"@",39:"#",40:"$",41:"(",
  42:")",44:"-",46:"+",47:"&",48:"=",
  49:";",50:":",52:"'",53:'"',54:"%",
  55:",",56:".",59:"/",60:"?",62:"♥"
};

const colours = {
  63:"#e12720",
  64:"#f47b00",
  65:"#ffb511",
  66:"#179447",
  67:"#2484cf",
  68:"#75318d",
  69:"#ffffff",
  70:"#111111",
  71:"#e5e3dd"
};

function renderBoard(characters) {
  board.replaceChildren();

  characters.forEach(rowData => {
    const row = document.createElement("div");
    row.className = "board-row";

    rowData.forEach(code => {
      const tile = document.createElement("div");
      tile.className = "tile";

      if (code >= 63 && code <= 71) {
        tile.style.background = colours[code];
      } else if (code !== 0) {
        tile.classList.add("filled");

        if (code >= 1 && code <= 26) {
          tile.textContent = letters[code - 1];
        } else if (code >= 27 && code <= 36) {
          tile.textContent = numbers[code - 27];
        } else {
          tile.textContent = symbols[code] || "";
        }
      }

      row.appendChild(tile);
    });

    board.appendChild(row);
  });
}

async function refreshBoard() {
  try {
    const response = await fetch(
      source + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Board data unavailable");
    }

    const data = await response.json();

    if (
      !Array.isArray(data.characters) ||
      data.characters.length !== 3 ||
      !data.characters.every(
        row => Array.isArray(row) &&
        row.length === 15
      )
    ) {
      throw new Error("Invalid board data");
    }

    renderBoard(data.characters);

    heading.textContent = "LIVE BOARD PREVIEW";

    notice.textContent =
      "Last board update: " +
      new Date(data.updatedAt).toLocaleString(
        "en-GB",
        { dateStyle:"short", timeStyle:"short" }
      );
  } catch (error) {
    heading.textContent = "BOARD PREVIEW UNAVAILABLE";
    notice.textContent =
      "Unable to load the latest display. Retrying automatically.";
    console.error(error);
  }
}

refreshBoard();
setInterval(refreshBoard, 60000);
</script>

</body>
</html>
